services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_WS_URL: http://localhost:4000/realtime
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:4000/realtime
    depends_on:
      - api

  api:
    image: node:20-alpine
    working_dir: /srv
    command: sh -c "echo 'Point api service at dhtcustomers-server build output'"
    profiles:
      - optional
