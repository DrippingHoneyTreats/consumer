# DHT customer app — Netlify staging/QA
# Site settings (UI):
#   Base directory:     (leave empty — repo root)
#   Package directory:  apps/customer
#
# Paths below are relative to the repo root (base), not apps/customer.

[build]
  command = "npm ci && npm run build -w @dht/customer"
  publish = "apps/customer/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_USE_TEMP_CATALOGUE = "true"
  NEXT_PUBLIC_APP_NAME = "Dripping Honey Treats"
  NEXT_PUBLIC_WHATSAPP = "2348000000000"
  NEXT_PUBLIC_API_URL = "https://api.staging.invalid/api/v1"
  NEXT_PUBLIC_WS_URL = "https://api.staging.invalid/realtime"

# OpenNext runtime — required so public/ assets (catalogue, banners) are served
[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.branch-deploy]
  command = "npm ci && npm run build -w @dht/customer"

[context.deploy-preview]
  command = "npm ci && npm run build -w @dht/customer"
